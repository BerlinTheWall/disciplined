name: CI

# Every push to main and every pull request. `concurrency` cancels the previous
# run when you push again to the same branch — no point paying for a build of
# a commit nobody will look at.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    # Kept to plain ASCII on purpose: this string is what you type into
    # the required-status-checks box in branch protection, and a name
    # containing a middle dot is effectively unsearchable there.
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `install`) — installs exactly what package-lock.json
      # pins and fails if the lockfile is out of sync with package.json.
      - run: npm ci

      # Split into separate steps rather than one `npm run ci` so a failure
      # names itself in the job summary instead of hiding behind "&&".
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite defaults to in-memory SQLite so `pytest` works locally with
    # nothing running. CI points it at a real Postgres -- same major version
    # as docker-compose uses in dev -- so the tests also run against the
    # engine production uses, and the models' JSONB columns are exercised as
    # JSONB rather than as SQLite's JSON stand-in.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: disciplined
          POSTGRES_PASSWORD: disciplined
          POSTGRES_DB: disciplined_test
        ports:
          - 5432:5432
        # Postgres accepts and drops connections while starting, so without a
        # healthcheck the first test can race the server.
        options: >-
          --health-cmd "pg_isready -U disciplined -d disciplined_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Import the whole app before running tests. Every setting in config.py
      # has a default, so this needs no .env and no database — but it does
      # execute every router and service import, which is what actually breaks
      # a deploy (a bad import never shows up in a unit test that only touches
      # one pure module).
      - name: Import smoke test
        run: python -c "import app.main"

      # Alembic resolves migration scripts from disk, so this needs no
      # database connection. Two heads means two branches each added a
      # migration from the same parent — caught here rather than at deploy,
      # where `alembic upgrade head` aborts and takes the release with it.
      - name: Single migration head
        run: |
          heads=$(python -m alembic heads | grep -c '(head)')
          echo "alembic heads: $heads"
          test "$heads" -eq 1

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://disciplined:disciplined@localhost:5432/disciplined_test
        run: python -m pytest -q

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Not gating merges yet: this suite is new, and a browser test that crosses
    # the whole stack earns the right to block a merge only once it has proved
    # it is not flaky. Promote it to a required check after it has been boring
    # for a couple of weeks.
    continue-on-error: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: disciplined
          POSTGRES_PASSWORD: disciplined
          POSTGRES_DB: disciplined_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disciplined -d disciplined_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://disciplined:disciplined@localhost:5432/disciplined_e2e
      JWT_SECRET: e2e-only-not-a-real-secret
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e-test-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      # Start the API before seeding: startup runs `alembic upgrade head`, and
      # seeding into a database Alembic has not migrated yet would create the
      # schema out from under it.
      - name: Start the API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level info > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "api up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not come up within 45s"
          exit 1

      - name: Seed the test account
        working-directory: backend
        run: python scripts/seed_e2e_user.py

      # Log in through the API before the browser gets involved. If this fails,
      # the problem is the account or the database and there is no point
      # reading a Playwright trace; if it passes, any browser failure is the
      # frontend's.
      - name: Check the seeded account can log in
        run: |
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\"}")
          echo "login -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::The seeded account cannot log in through the API ($code)."
            # The body carries the reason (wrong password, unverified, locked)
            # and contains no token on a failure.
            cat /tmp/login.json
            exit 1
          fi
          echo "token received, account is usable"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright builds the app and serves it with `vite preview` itself
      # (see the webServer block in playwright.config.ts). VITE_API_URL is left
      # at its default, which is already the API started above.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      # The API's own view of what the browser asked it, which is the other
      # half of any e2e failure that looks like a UI problem.
      - name: API log
        if: failure()
        run: tail -100 /tmp/api.log || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true
