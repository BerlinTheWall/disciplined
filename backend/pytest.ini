[pytest]
# asyncio_mode=auto so async tests need no per-test decorator; the fixtures in
# conftest.py are async throughout.
asyncio_mode = auto
# The engine and schema are built once per session, so the fixtures AND the
# tests must share that one event loop. Setting only the fixture scope leaves
# tests on a per-function loop, and asyncpg connections created on the session
# loop then fail with "attached to a different loop" the moment a test uses
# them. (aiosqlite tolerates the mismatch, so this only shows up against
# Postgres — which is precisely why CI runs both.)
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    # starlette's TestClient warns about httpx; we use httpx.AsyncClient directly
    # in the fixtures, and the one place TestClient appears is deliberate.
    ignore::DeprecationWarning:starlette.*
